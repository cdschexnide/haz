type Query {
  # Preparer
  """
  Query preparer shipments with optional filters
  """
  preparerShipments(
    """
    Filter criteria
    """
    filters: PreparerShipmentFilters
  ): [PreparerShipment!]!

  # Inspector
  """
  Query inspector shipments with optional filters
  """
  inspectorShipments(
    """
    Filter criteria
    """
    filters: InspectorShipmentFilters
  ): [InspectorShipment!]!
}

type Mutation {
  # Preparer
  """
  Create a new preparer shipment
  """
  createPreparerShipment(
    """
    Shipment creation data
    """
    input: CreatePreparerShipmentInput!
  ): PreparerShipment!

  """
  Update an existing preparer shipment
  """
  updatePreparerShipment(
    """
    Shipment ID
    """
    uuid: ID!
    """
    Shipment update data
    """
    input: UpdatePreparerShipmentInput!
  ): PreparerShipment!

  """
  Mark preparer shipment as complete
  """
  completePreparerShipment(
    """
    Shipment ID
    """
    uuid: ID!
  ): PreparerShipment!

  """
  Delete a preparer shipment
  """
  deletePreparerShipment(
    """
    Shipment ID
    """
    uuid: ID!
  ): Boolean!

  # Inspector
  """
  Create a new inspection
  """
  createInspection(
    """
    Inspection data
    """
    input: CreateInspectionInput!
  ): InspectorShipment!

  """
  Update an existing inspection
  """
  updateInspection(
    """
    Inspection ID
    """
    uuid: ID!
    """
    Updated inspection data
    """
    input: UpdateInspectionInput!
  ): InspectorShipment!

  """
  Mark inspection as complete
  """
  completeInspection(
    """
    Inspection ID
    """
    uuid: ID!
  ): InspectorShipment!

  """
  Delete an inspection
  """
  deleteInspection(
    """
    Inspection ID
    """
    uuid: ID!
  ): Boolean!

  """
  Add a SDDG frustration to an inspection
  """
  addSDDGFrustration(
    """
    Inspection ID
    """
    inspectionUuid: ID!
    """
    Frustration data
    """
    frustration: SDDGFrustrationInput!
  ): InspectorShipment!

  """
  Remove a SDDG frustration from an inspection
  """
  removeSDDGFrustration(
    """
    Inspection ID
    """
    inspectionUuid: ID!
    """
    Frustration key to remove
    """
    frustrationKey: String!
  ): InspectorShipment!

  """
  Add a package frustration to an inspection
  """
  addPackageFrustration(
    """
    Inspection ID
    """
    inspectionUuid: ID!
    """
    Package frustration data
    """
    frustration: PackageFrustrationInput!
  ): InspectorShipment!

  """
  Remove a package frustration from an inspection
  """
  removePackageFrustration(
    """
    Inspection ID
    """
    inspectionUuid: ID!
    """
    Item ID to remove
    """
    itemId: String!
  ): InspectorShipment!
}

