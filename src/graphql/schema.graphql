"""
Base interface for all HazPro Record types.
Records provide audit trails for field values, tracking all changes over time.
"""
interface HazProRecord {
  """
  Unique identifier for this record
  """
  uuid: ID!

  """
  Event history tracking all modifications made to this record (create/update/delete)
  """
  eventHistory: [HazProRecordEvent!]!
}

"""
Base interface for all HazPro RecordEvent types.
RecordEvents capture a specific change to a Record, including who made the change and when.
"""
interface HazProRecordEvent {
  """
  Unique identifier for this event
  """
  uuid: ID!

  """
  When this change occurred
  """
  createdAt: Time!

  """
  User who made this change
  """
  createdBy: User!
}

